# --- Pas de fallback ----------------------------------------------------
# Une URL inconnue doit renvoyer un vrai 404 (Netlify sert 404.html), et
# non un 200 avec la page d'accueil : un soft 404 fait crawler à Google
# une infinité d'URL inexistantes au détriment des vraies pages.

[build.processing]
  [build.processing.html]
    # false : les liens internes restent en .html et pointent donc vers
    # l'URL canonique. Avec true, Netlify réécrivait tout le maillage vers
    # des URL sans extension, différentes du sitemap et des canonical.
    pretty_urls = false
    bundle = true
  [build.processing.css]
    bundle = true
    minify = true

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
