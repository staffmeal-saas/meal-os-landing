[build]
  publish = "."

# --- Redirections de marque : Meal OS -> Staff Meal ---------------------
# L'ordre compte : Netlify applique la première règle qui correspond.

# --- Mesure d'audience : proxy first-party vers Plausible (stats.staff-meal.com) ---
# Servi depuis staff-meal.com pour ne pas être bloqué par les bloqueurs de pub.
# Pas d'extension .js sur /s/script : sinon la règle de cache "immutable 1 an" sur /*.js
# figerait le script Plausible chez les visiteurs.
[[redirects]]
  from = "/s/script"
  to = "https://stats.staff-meal.com/js/script.outbound-links.file-downloads.js"
  status = 200
  force = true

# /s/event est servi par l'Edge Function netlify/edge-functions/plausible-event.ts
# (elle transmet l'IP réelle du visiteur, ce qu'une redirection ne sait pas faire).

[[redirects]]
  from = "/meal-os-vs-skello.html"
  to = "/staffmeal-vs-skello.html"
  status = 301
  force = true

[[redirects]]
  from = "/meal-os-vs-koust.html"
  to = "/staffmeal-vs-koust.html"
  status = 301
  force = true

[[redirects]]
  from = "/meal-os-vs-combo.html"
  to = "/staffmeal-vs-combo.html"
  status = 301
  force = true

[[redirects]]
  from = "/meal-os-vs-skello"
  to = "/staffmeal-vs-skello.html"
  status = 301
  force = true

[[redirects]]
  from = "/meal-os-vs-koust"
  to = "/staffmeal-vs-koust.html"
  status = 301
  force = true

[[redirects]]
  from = "/meal-os-vs-combo"
  to = "/staffmeal-vs-combo.html"
  status = 301
  force = true

# --- Canonicalisation d'URL --------------------------------------------
# Une seule URL par page : la version .html, celle du sitemap, des
