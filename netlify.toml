[build.processing]
  [build.processing.html]
    # false : les liens internes restent en .html et pointent donc vers
    # l'URL canonique. Avec true, Netlify réécrivait tout le maillage vers
    # des URL sans extension, différentes du sitemap et des canonical.
    pretty_urls = false
    bundle = true
  [build.processing.css]
    bundle = true
    minify = true

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

